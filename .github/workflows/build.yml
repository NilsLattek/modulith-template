name: Build template

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build working/content/modulith/ModulithTemplate.slnx -warnaserror
    - name: Test
      run: dotnet test
      working-directory: working/content/modulith
