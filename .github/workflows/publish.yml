name: Release to nuget.org

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    # https://learn.microsoft.com/en-us/nuget/nuget-org/trusted-publishing
    # https://devblogs.microsoft.com/dotnet/enhanced-security-is-here-with-the-new-trust-publishing-on-nuget-org/
    permissions:
      id-token: write  # enable GitHub OIDC token issuance for this job

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Build
      run: dotnet build working/content/modulith/ModulithTemplate.slnx --configuration Release
    - name: Version from tag
      id: version
      env:
        TAG: ${{ github.event.release.tag_name }}
      run: |
        VERSION="${TAG#v}"
        if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
          echo "::error::Release tag '$TAG' is not a SemVer version (expected e.g. v1.2.3 or 1.2.3-beta.1)"
          exit 1
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
    - name: Pack
      run: dotnet pack working/ModularMonolith.Template.csproj -p:PackageVersion=${{ steps.version.outputs.version }}
    # Get a short-lived NuGet API key
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        # Recommended: use a secret like ${{ secrets.NUGET_USER }} for your nuget.org username (profile name), NOT your email address
        user: ${{ secrets.NUGET_USER }}
    - name: Publish
      run: dotnet nuget push "working/bin/Release/Modulith.*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json
