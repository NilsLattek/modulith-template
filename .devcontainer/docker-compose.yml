services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

    volumes:
      - ../..:/workspaces:cached

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # Runs app on the same network as the database container, allows "forwardPorts" in devcontainer.json function.
    network_mode: service:db

    # Uncomment to connect as root instead. More info: https://aka.ms/dev-containers-non-root.
    # user: root

  db:
    image: postgres:18.3
    restart: unless-stopped
    # Postgres 18 moved PGDATA to /var/lib/postgresql/18/docker and declares the *parent*,
    # /var/lib/postgresql, as its volume. Mounting anything else — including the pre-18
    # /var/lib/postgresql/data — leaves the real data directory in the container's writable
    # layer, so the database silently resets on every rebuild.
    volumes:
      - postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres

volumes:
  postgres-data: